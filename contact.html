<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous - TGT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-info-box { background: white; padding: 20px; border-radius: 14px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .info-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .info-row:last-child { margin-bottom: 0; }
        .info-icon { font-size: 1.5rem; }
        .info-text h3 { font-size: 0.9rem; color: #777; font-weight: normal; margin: 0; }
        .info-text p { font-size: 1rem; font-weight: bold; color: var(--primary-dark); margin: 2px 0 0 0; }
        
        .social-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .btn-link { display: flex; align-items: center; justify-content: center; gap: 10px; background: white; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        
        .form-box { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; }
        .form-group input, .form-group textarea { padding: 10px; border: 1px solid #ebdcb9; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .form-group textarea { resize: none; height: 90px; }
        .send-btn { width: 100%; background: var(--primary-dark); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <a href="index.html" style="color: white; text-decoration: none; font-size: 1.2rem;">⬅</a>
            <h1>Contactez-nous</h1>
            <span></span>
        </div>
    </header>

    <main class="app-container">

        <!-- COORDONNÉES OFFICIELLES DE L'ÉGLISE -->
        <section class="contact-info-box">
            <div class="info-row">
                <div class="info-icon">📧</div>
                <div class="info-text">
                    <h3>Email Secrétariat</h3>
                    <p style="font-size: 0.85rem; word-break: break-all;">tropheedegracetabernacle38@gmail.com</p>
                </div>
            </div>
            <div class="info-row">
                <div class="info-icon">📞</div>
                <div class="info-text">
                    <h3>Téléphone Administration</h3>
                    <p>+243 854014426</p> <!-- Remplacez par votre vrai numéro -->
                </div>
            </div>
        </section>

        <!-- ACCÈS AUX RÉSEAUX SOCIAUX ET WHATSAPP -->
        <section class="social-buttons">
            <!-- Remplacer par votre lien complet WhatsApp -->
            <a href="https://wa.me" target="_blank" class="btn-link" style="border-bottom: 3px solid #25D366;">
                <span>💬 WhatsApp</span>
            </a>
            <!-- Remplacer par le lien de votre page Facebook -->
            <a href="https://facebook.com" target="_blank" class="btn-link" style="border-bottom: 3px solid #1877F2;">
                <span>🔵 Facebook</span>
            </a>
        </section>

        <!-- FORMULAIRE COMPATIBLE ENVOI EMAIL -->
        <section class="form-box">
            <h2 style="font-size: 1rem; margin-bottom: 15px; color: var(--primary-dark);">Envoyer une requête ou demande de prière</h2>
            <form action="mailto:tropheedegracetabernacle38@gmail.com" method="GET" enctype="text/plain">
                <div class="form-group">
                    <label>Sujet du message</label>
                    <input type="text" name="subject" placeholder="Ex: Requête de prière, Question..." required>
                </div>
                <div class="form-group">
                    <label>Votre message</label>
                    <textarea name="body" placeholder="Écrivez votre message en détails ici..." required></textarea>
                </div>
                <button type="submit" class="send-btn">Ouvrir l'e-mail pour envoyer</button>
            </form>
        </section>

    </main>

</body>
</html>
