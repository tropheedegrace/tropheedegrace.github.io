<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Régie Professionnelle - TGT</title>
    
    <!-- Base de données externe connectée -->
    <script src="donnees.js"></script>

    <style>
        /* ==========================================================
           CHARTE GRAPHIQUE ARTISTIQUE & SOMBRE (STYLE RÉGIE PRO)
           ========================================================== */
        :root {
            --bg-dark-main: #12161a;     /* Fond général très sombre */
            --bg-panel: #1a1f26;        /* Fond des panneaux de contrôle */
            --primary-gold: #d69e2e;     /* Or artistique TGT */
            --blue-tabernacle: #0b4c8c;  /* Bleu officiel TGT */
            --text-light: #e2e8f0;       /* Couleur texte régie */
            --border-color: #2d3748;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark-main);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barre supérieure type logiciel */
        .app-header-pro {
            background-color: var(--bg-panel);
            border-bottom: 2px solid var(--primary-gold);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header-pro h1 { font-size: 1.1rem; color: #fff; font-weight: 600; }
        .back-link { color: var(--primary-gold); text-decoration: none; font-weight: bold; font-size: 0.9rem; }

        /* BARRE D'OUTILS ET CONFIGURATEUR DE CARACTÈRES/FONDS */
        .artistic-style-bar {
            background-color: #1e252f;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.7rem; text-transform: uppercase; color: #a0aec0; letter-spacing: 0.5px; font-weight: bold; }
        .control-group select { background: #2d3748; color: #fff; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 4px; outline: none; font-size: 0.85rem; }
        
        /* Boutons de taille rapides */
        .size-btns { display: flex; gap: 4px; }
        .size-btns button { background: #2d3748; color: #fff; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .size-btns button:active { background: var(--primary-gold); }

        /* Boutons ronds de couleurs */
        .color-palette { display: flex; gap: 6px; align-items: center; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.1s; }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.active-dot { border-color: #fff; }

        /* STRUCTURE EN 3 COLONNES COMPLÈTE (Correction de la grille) */
        .regie-grid-pro {
            display: grid;
            grid-template-columns: 320px 1fr 340px; /* 3 colonnes fixes côte à côte */
            gap: 15px;
            padding: 15px;
            flex: 1;
            height: calc(100vh - 110px);
            overflow: hidden;
        }

        .pro-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pro-panel-title {
            background-color: #242b35;
            padding: 10px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--primary-gold);
            border-bottom: 1px solid var(--border-color);
        }

        /* Colonne 1 : Bibliothèque & Agenda */
        .vps-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: #1a1f26; border-bottom: 1px solid var(--border-color); }
        .vps-tab-btn { background: transparent; border: none; padding: 10px; color: #a0aec0; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center; }
        .vps-tab-btn.active-tab { background: #242b35; color: #fff; border-bottom: 3px solid var(--primary-gold); }
        .search-container { padding: 10px; border-bottom: 1px solid var(--border-color); }
        .search-container input { width: 100%; background: #2d3748; border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 5px; outline: none; font-size: 0.85rem; }
        .agenda-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
        .agenda-item { padding: 10px; border-radius: 5px; margin-bottom: 6px; font-size: 0.85rem; cursor: pointer; border-left: 3px solid transparent; background: #202630; }
        .agenda-item:hover { background: #28303d; border-left-color: var(--primary-gold); }
        .agenda-item.selected { background: #2d3748; font-weight: bold; border-left-color: var(--primary-gold); color: #fff; }

        /* Colonne 2 : Champ Préparatoire (Rédacteur central / Preview) */
        .editor-workspace { padding: 15px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .editor-box { width: 100%; flex: 1; background: #12161a; border: 1px solid var(--border-color); color: #fff; padding: 15px; border-radius: 6px; font-size: 1.05rem; font-family: inherit; resize: none; outline: none; line-height: 1.6; }
        .editor-box:focus { border-color: var(--primary-gold); }
        .btn-action-trigger { background: var(--blue-tabernacle); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-action-trigger:active { transform: scale(0.99); background: #07325d; }

        /* Colonne 3 : Diapositives Prêtes */
        .slides-scrollview { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .diapo-thumbnail { background: #202630; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; text-align: center; white-space: pre-line; color: #cbd5e1; }
        .diapo-thumbnail:hover { border-color: var(--primary-gold); background: #28303d; }
        .diapo-thumbnail.live-active { background: #4a1d1d; border-color: #e53e3e; font-weight: bold; color: #fff; }

        /* Projection Finale Miniature (Moniteur de contrôle en bas à droite) */
        .live-monitor-panel { background: #222; border-top: 2px solid var(--primary-gold); padding: 10px; height: 170px; display: flex; flex-direction: column; }
        .monitor-display { background: #000; border: 1px solid #333; flex: 1; border-radius: 4px; padding: 10px; font-size: 0.85rem; font-weight: bold; text-align: center; white-space: pre-line; overflow-y: auto; display: flex; align-items: center; justify-content: center; }

        /* SORTIE ÉCRAN GÉANT PROJECTEUR POUR L'ÉGLISE */
        #screen-projector {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
            padding: 50px; text-align: center; background-color: #000000; color: #ffffff;
        }
        .projected-text { font-size: 3.8rem; font-weight: bold; line-height: 1.5; width: 85%; white-space: pre-line; }
        .close-proj-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ENTÊTE LOGICIEL -->
    <header class="app-header-pro">
        <h1>TGT Régie Média Pro - Système Intégré</h1>
        <a href="index.html" class="back-link">⬅ Retour Accueil</a>
    </header>

    <!-- BARRE D'OUTILS CONFIGURATEUR TECHNIQUE -->
    <section class="artistic-style-bar">
        <div class="control-group">
            <label>Caractère / Police</label>
            <select id="select-font" onchange="synchroniserStylesPro()">
                <option value="'Segoe UI', sans-serif">Segoe UI (Moderne)</option>
                <option value="'Arial', sans-serif">Arial (Classique)</option>
                <option value="'Georgia', serif">Georgia (Écritures)</option>
                <option value="'Impact', sans-serif">Impact (Large d'Église)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Taille Caractère</label>
            <div class="size-btns">
                <button type="button" onclick="modifierTaillePro(-0.5)">A -</button>
                <button type="button" onclick="modifierTaillePro(0.5)">A +</button>
            </div>
        </div>

        <div class="control-group">
            <label>Couleur Caractère</label>
            <div class="color-palette">
                <div class="color-dot active-dot" style="background:#ffffff;" onclick="changerCouleurTextePro('#ffffff', this)" title="Blanc Pur"></div>
                <div class="color-dot" style="background:#ffd700;" onclick="changerCouleurTextePro('#ffd700', this)" title="Or Céleste"></div>
                <div class="color-dot" style="background:#ffff00;" onclick="changerCouleurTextePro('#ffff00', this)" title="Jaune Vif"></div>
                <div class="color-dot" style="background:#00ffff;" onclick="changerCouleurTextePro('#00ffff', this)" title="Cyan Cristal"></div>
<!-- ÉCRAN DE PROJECTION STYLE VIDEOPSALM -->
<div id="screen-projector">

    <!-- Titre discret en haut -->
    <div class="projection-title" id="projection-title">
        GLOIRE, GLOIRE À L'ÉTERNEL
    </div>

    <!-- Numéro de la diapositive -->
    <div class="projection-number" id="projection-number">
        1
    </div>

    <!-- Paroles -->
    <div class="projected-text" id="projected-text">
        LOIRE, GLOIRE À L'ÉTERNEL
        (HOSANNA)
    </div>

    <!-- Commandes -->
    <div class="projection-controls">
        <button onclick="diapoPrecedente()">◀</button>
        <button onclick="fermerProjection()">✕ QUITTER</button>
        <button onclick="diapoSuivante()">▶</button>
    </div>

</div>
