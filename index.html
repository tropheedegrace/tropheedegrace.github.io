<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophée de Grâce Tabernacle</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Liaison avec le fichier de configuration de l'application -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8a6d3b">
    
    <!-- Script pour activer l'application sur le téléphone -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Application TGT prête !'))
          .catch((err) => console.log('Erreur application:', err));
      }
    </script>
</head>

<body>

    <!-- BARRE SUPÉRIEURE APPLICATION FIXE -->
    <header class="app-header">
        <div class="header-content">
            <span class="menu-icon">☰</span>
            <h1>Trophée de Grâce Tabernacle</h1>
                    <button onclick="ouvrirParametres()" style="background: transparent; border: none; color: white; font-size: 1.3rem; cursor: pointer; padding: 5px; float: right; margin-top: -32px;">⚙️</button>

            <!-- Badge dynamique de version -->
            <span id="badge-statut" class="status-badge free-badge">Version Gratuite</span>
        </div>
    </header>

    <main class="app-container">

        <!-- ZONE LOGO ET APPARENCE ÉPURÉE (Sans le long texte de bienvenue) -->
        <section class="hero-section">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Logo TGT" class="main-logo">
            </div>
            
            <!-- BARRE DE RECHERCHE GLOBALE -->
            <div class="search-box">
                <input type="text" id="global-search" placeholder="Rechercher un cantique, une prédication, un verset...">
                <button type="button" class="search-btn">🔍</button>
            </div>
        </section>

        <!-- GRILLE DE NAVIGATION EN FORME DE DOSSIERS -->
        <section class="folder-grid">

            <!-- Dossier Actualités -->
            <a href="actualite.html" class="folder-card">
                <div class="folder-icon-box">📰</div>
                <span class="folder-title">Actualités</span>
            </a>

            <!-- Dossier Services / Église -->
            <a href="services.html" class="folder-card">
                <div class="folder-icon-box">⛪</div>
                <span class="folder-title">Services & Église</span>
            </a>

            <!-- Dossier Multimédia (Prédications, Musiques, Photos) -->
            <a href="multimedia.html" class="folder-card">
                <div class="folder-icon-box">🎵</div>
                <span class="folder-title">Multimédias</span>
            </a>

            <!-- Dossier Publications (Brochures) -->
            <a href="publications.html" class="folder-card">
                <div class="folder-icon-box">📚</div>
                <span class="folder-title">Publications</span>
            </a>

            <!-- PAGE DÉDIÉE DE LA BIBLE (Prend toute la largeur en bas) -->
            <a href="bible.html" class="folder-card full-width-card bible-theme">
                <div class="folder-icon-box">📖</div>
                <div class="card-text">
                    <span class="folder-title">La Sainte Bible</span>
                    <small>Accéder aux Écritures et lectures</small>
                </div>
            </a>

            <!-- Lien direct pour le flux YouTube en direct -->
            <a href="https://youtube.com" target="_blank" class="folder-card full-width-card live-theme">
                <div class="folder-icon-box">🔴</div>
                <div class="card-text">
                    <span class="folder-title">Culte en Direct</span>
                    <small>Suivez-nous sur YouTube</small>
                </div>
            </a>

        </section>

        <!-- CONTROLEUR DE VERSION PAYS (Pour vos tests d'intégration payant/gratuit) -->
        <div class="version-toggle-zone">
            <p>Statut actuel : <strong id="account-text" style="color: #666;">Gratuit</strong></p>
            <button onclick="changerVersion()" class="action-btn">Simuler l'achat (Passer en Premium)</button>
        </div>

    </main>

    <script>
        // Logique de simulation pour le mode Gratuit / Payant
        function changerVersion() {
            const badge = document.getElementById('badge-statut');
            const text = document.getElementById('account-text');
            
            if (badge.classList.contains('free-badge')) {
                badge.classList.remove('free-badge');
                badge.classList.add('premium-badge');
                badge.innerText = "Version Premium";
                text.innerText = "Premium Activé (Accès illimité)";
                text.style.color = "#d69e2e";
            } else {
                badge.classList.remove('premium-badge');
                badge.classList.add('free-badge');
                badge.innerText = "Version Gratuite";
                text.innerText = "Gratuit";
                text.style.color = "#666";
            }
        }
    </script>

</body>
<!-- FENÊTRE FLOTTANTE DES PARAMÈTRES (MODAL) -->
<div id="settings-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; padding: 20px;">
    <div style="background: #1a1f26; border: 2px solid #d69e2e; border-radius: 16px; width: 100%; max-width: 340px; padding: 20px; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.5); font-family: 'Segoe UI', sans-serif;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #2d3748; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="font-size: 1.1rem; color: #d69e2e; margin: 0;">⚙️ Paramètres de l'App</h3>
            <button onclick="fermerParametres()" style="background: transparent; border: none; color: #a0aec0; font-weight: bold; cursor: pointer; font-size: 1.1rem;">❌</button>
        </div>

        <!-- OPTION 1 : SÉLECTION DU THÈME -->
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.75rem; font-weight: bold; color: #a0aec0; display: block; margin-bottom: 5px; text-transform: uppercase;">Changement de Thème</label>
            <select id="app-theme-select" onchange="changerThemeGlobal(this.value)" style="width: 100%; background: #2d3748; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; outline: none; cursor: pointer;">
                <option value="sombre" selected>Noir Artistique (Par défaut)</option>
                <option value="beige">Beige Tabernacle</option>
                <option value="blanc">Blanc Classique</option>
            </select>
        </div>

        <!-- OPTION 2 : SÉLECTION DE LA POLICE -->
        <div style="margin-bottom: 20px;">
            <label style="font-size: 0.75rem; font-weight: bold; color: #a0aec0; display: block; margin-bottom: 5px; text-transform: uppercase;">Police de l'application</label>
            <select id="app-font-select" onchange="changerPoliceGlobale(this.value)" style="width: 100%; background: #2d3748; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; outline: none; cursor: pointer;">
                <option value="'Segoe UI', sans-serif">Segoe UI (Moderne)</option>
                <option value="'Arial', sans-serif">Arial</option>
                <option value="'Georgia', serif">Georgia (Écritures)</option>
            </select>
        </div>

        <!-- ACCÈS AU BLOC-NOTES -->
        <div style="border-top: 1px solid #2d3748; padding-top: 15px; text-align: center;">
            <a href="blocnotes.html" style="display: block; width: 100%; background: #0b4c8c; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(11, 76, 140, 0.2);">
                📝 Ouvrir mon Bloc-notes du Culte
            </a>
        </div>
    </div>
</div>

<!-- LE SCRIPT DES PARAMÈTRES -->
<script>
    function ouvrirParametres() {
        document.getElementById('settings-popup').style.display = 'flex';
    }
    function fermerParametres() {
        document.getElementById('settings-popup').style.display = 'none';
    }

    function changerThemeGlobal(theme) {
        if (theme === 'sombre') {
            document.body.style.backgroundColor = '#12161a';
            document.body.style.color = '#e2e8f0';
        } else if (theme === 'beige') {
            document.body.style.backgroundColor = '#f4ecd8';
            document.body.style.color = '#3a352a';
        } else if (theme === 'blanc') {
            document.body.style.backgroundColor = '#ffffff';
            document.body.style.color = '#2d3748';
        }
    }

    function changerPoliceGlobale(police) {
        document.body.style.fontFamily = police;
    }
</script>

</html>
